name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - main-secondary
  pull_request:
    branches:
      - main
      - master
      - main-secondary
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and run unit tests
        run: mvn clean package

      - name: Upload Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: "**/target/*.jar"
          if-no-files-found: warn
          retention-days: 30

      - name: Create Dockerfile if not present
        run: |
          if [ ! -f Dockerfile ]; then
          cat > Dockerfile << 'DEOF'
          FROM eclipse-temurin:17-jre-jammy
          WORKDIR /app
          COPY target/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
          DEOF
          fi

      - name: Verify JAR artifact exists
        run: ls -la target/*.jar

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.PLATFORM_GHCR_USERNAME }}
          password: ${{ secrets.PLATFORM_GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ghcr.io/vira250/github-actions:${{ github.sha }}
            ghcr.io/vira250/github-actions:${{ steps.vars.outputs.sha_short }}
            ghcr.io/vira250/github-actions:latest

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: java
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true