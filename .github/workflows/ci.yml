name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build project artifacts
        run: mvn --batch-mode clean package -DskipTests

      - name: Run automated tests (JUnit)
        run: mvn --batch-mode test

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build-jar
          path: target/*.jar
          retention-days: 5

  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: 'java'

      - name: Set up JDK 17 for CodeQL Build
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build Java Code for CodeQL Analysis
        run: mvn --batch-mode clean package -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  deploy:
    name: Deployment
    needs: [build-and-test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build-jar
          path: target/

      - name: Deploy application
        env:
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_EVENT: ${{ github.event_name }}
        run: |
          echo "Deploying application to target environment"
          echo "Triggered by ref: ${DEPLOY_REF} via event: ${DEPLOY_EVENT}"
          # Add actual deployment commands here (e.g., AWS, Azure, GCP, or SSH deployment)