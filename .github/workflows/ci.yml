name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - main-secondary
  pull_request:
    branches:
      - main
      - master
      - main-secondary
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: CodeQL Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  build-test-publish:
    name: Build, Test, and Package Application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build project artifacts
        run: ./mvnw clean package -DskipTests

      - name: Run automated tests (JUnit)
        run: ./mvnw test

      - name: Upload Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: "**/target/*.jar"
          if-no-files-found: warn
          retention-days: 30

      - name: Create Dockerfile if not present
        run: |
          if [ ! -f Dockerfile ]; then
            cat > Dockerfile << 'DEOF'
          FROM eclipse-temurin:17-jre-jammy
          WORKDIR /app
          COPY target/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
          DEOF
          fi

      - name: Verify JAR artifact exists
        run: ls -la target/*.jar

      - name: Lowercase image name for GHCR
        run: echo "IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: false