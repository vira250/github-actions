name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - main-secondary
  pull_request:
    branches:
      - main
      - master
      - main-secondary
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  build-test-publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and run tests
        run: mvn clean package

      - name: Upload Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: "**/target/*.jar"
          if-no-files-found: warn
          retention-days: 30

      - name: Create Dockerfile if not present
        run: |
          if [ ! -f Dockerfile ]; then
          cat > Dockerfile << 'DEOF'
          FROM eclipse-temurin:17-jre-jammy
          WORKDIR /app
          COPY target/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
          DEOF
          fi

      - name: Verify JAR artifact exists
        run: ls -la target/*.jar

      - name: Lowercase image name for GHCR
        env:
          RAW_REPO: ${{ github.repository }}
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo "$RAW_REPO" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: false