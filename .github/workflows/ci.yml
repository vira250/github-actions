name: Java CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - main-secondary
  pull_request:
    branches:
      - main
      - master
      - main-secondary
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  packages: write
  pull-requests: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Initialize CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true

  build-test-publish:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build project artifacts
        run: mvn clean package -DskipTests

      - name: Run automated tests (JUnit)
        run: mvn test

      - name: Upload Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: "**/target/*.jar"
          if-no-files-found: warn
          retention-days: 30

      - name: Set Short Commit SHA
        name: Generate Short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Create Dockerfile if not present
        name: Ensure Dockerfile Exists
        run: |
          if [ ! -f Dockerfile ]; then
            cat << 'EOF' > Dockerfile
          FROM eclipse-temurin:17-jre-jammy
          WORKDIR /app
          COPY target/*.jar app.jar
          EXPOSE 8080
          ENTRYPOINT ["java", "-jar", "app.jar"]
          EOF
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.PLATFORM_GHCR_USERNAME }}
          password: ${{ secrets.PLATFORM_GHCR_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/vira250/github-actions:${{ github.sha }}
            ghcr.io/vira250/github-actions:${{ env.SHORT_SHA }}
            ghcr.io/vira250/github-actions:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy application
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/main-secondary' || github.ref == 'refs/heads/master')
        run: |
          echo "Deploying application to target environment..."